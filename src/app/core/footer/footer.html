<footer class="px-6 py-12 text-center text-xs text-slate-500 border-t border-slate-200/80 dark:border-white/5 bg-slate-50/50 dark:bg-black/20">
  <div class="max-w-6xl mx-auto flex flex-col sm:flex-row items-center justify-between gap-4">
    <p class="text-slate-600 dark:text-slate-400">
      © {{ currentYear }} <strong class="text-slate-900 dark:text-white font-semibold">Gastón Elias Godoy</strong> · {{ i18n.t('footerRights') }}
    </p>

    <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-slate-200/60 dark:bg-white/5 border border-slate-200 dark:border-white/10 text-slate-700 dark:text-slate-300">
      <span aria-hidden="true">👁️</span>
      <span>{{ i18n.t('footerVisits') }}:</span>
      <span class="font-bold text-blue-600 dark:text-blue-400">
        {{ visits > 0 ? visits : '1' }}
      </span>
    </div>
  </div>
</footer>
