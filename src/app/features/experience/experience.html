<section id="experience" class="px-4 sm:px-6 pt-16 pb-28 max-w-5xl mx-auto scroll-mt-24">
  <!-- TÍTULO DE LA SECCIÓN -->
  <div class="text-center mb-16">
    <div class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-semibold bg-blue-500/10 text-blue-600 dark:text-blue-400 border border-blue-500/20 mb-3">
      <span>💼 Trayectoria Profesional</span>
    </div>
    <h2 class="text-3xl sm:text-4xl md:text-5xl font-extrabold tracking-tight mb-4 text-slate-900 dark:text-white">
      {{ i18n.t('experienceTitle') }}
    </h2>
    <p class="max-w-2xl mx-auto text-slate-600 dark:text-slate-300 text-base sm:text-lg">
      {{ i18n.t('experienceSubtitle') }}
    </p>
  </div>

  <!-- TIMELINE / LISTA DE EXPERIENCIAS -->
  <div class="space-y-12">
    <div
      *ngFor="let exp of experiences; let i = index"
      reveal
      class="glass reveal rounded-3xl p-6 sm:p-8 md:p-10 border border-slate-200/80 dark:border-white/5 shadow-xl transition-all duration-300 hover:shadow-2xl relative overflow-hidden"
    >
      <!-- HEADER DEL ROL -->
      <div class="flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4 mb-6 pb-6 border-b border-slate-200/60 dark:border-white/5">
        <div class="flex items-center gap-4">
          <div class="w-14 h-14 sm:w-16 sm:h-16 rounded-2xl bg-white p-2 shadow-sm border border-slate-100 flex-shrink-0 flex items-center justify-center">
            <img
              *ngIf="exp.logo"
              [src]="exp.logo"
              [alt]="exp.company"
              class="w-full h-full object-contain"
            />
          </div>

          <div>
            <h3 class="text-xl sm:text-2xl font-bold text-slate-900 dark:text-white">
              {{ i18n.t(exp.roleKey) }}
            </h3>
            <div class="flex items-center gap-2 mt-1">
              <span class="text-base font-semibold text-blue-600 dark:text-blue-400">
                {{ exp.company }}
              </span>
              <span *ngIf="i === 0" class="px-2 py-0.5 rounded text-[10px] font-bold uppercase bg-emerald-500/10 text-emerald-600 dark:text-emerald-400 border border-emerald-500/20">
                Actual
              </span>
            </div>
          </div>
        </div>

        <span class="inline-flex items-center px-4 py-1.5 rounded-full text-xs sm:text-sm font-semibold bg-slate-100 dark:bg-white/10 text-slate-800 dark:text-slate-200 border border-slate-200 dark:border-white/10 self-start sm:self-center">
          🗓️ {{ i18n.t(exp.periodKey) }}
        </span>
      </div>

      <!-- RESPONSABILIDADES -->
      <div class="mb-8">
        <h4 class="text-xs font-bold uppercase tracking-wider text-slate-400 mb-4">
          Principales Responsabilidades e Impacto:
        </h4>
        <ul class="space-y-3.5">
          <li
            *ngFor="let key of exp.responsibilitiesKeys"
            class="flex items-start gap-3 text-sm sm:text-base text-slate-700 dark:text-slate-300 leading-relaxed"
          >
            <span class="text-blue-500 font-bold mt-0.5">•</span>
            <span>{{ i18n.t(key) }}</span>
          </li>
        </ul>
      </div>

      <!-- STACK TECNOLÓGICO -->
      <div *ngIf="exp.stack?.length">
        <h4 class="text-xs font-bold uppercase tracking-wider text-slate-400 mb-3">
          Entorno Técnico & Herramientas:
        </h4>
        <div class="flex flex-wrap gap-2">
          <span
            *ngFor="let tech of exp.stack"
            class="px-3 py-1 text-xs rounded-lg font-medium bg-slate-100 dark:bg-white/5 text-slate-700 dark:text-slate-300 border border-slate-200/60 dark:border-white/5"
          >
            {{ tech }}
          </span>
        </div>
      </div>
    </div>
  </div>
</section>
